[project]
name = "drum_gesture"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "einops>=0.8.1",
    "flucoma-torch>=0.1.2",
    "hydra-core>=1.3.2",
    "imblearn>=0.0",
    "lightning>=2.5.2",
    "loguru>=0.7.3",
    "numba>=0.61.2",
    "scipy>=1.16.1",
    "torch>=2.8.0",
    "torchaudio>=2.8.0",
]

[project.scripts]
drum-gesture = "drum_gesture:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "black>=25.1.0",
    "ipykernel>=6.30.1",
    "matplotlib>=3.10.5",
    "nbstripout>=0.8.1",
    "pre-commit>=4.3.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
