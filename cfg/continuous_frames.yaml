defaults:
  - model: buzz_rnn
  - loss: bce
  - task: continuous_gesture
  - _self_

hydra:
  job:
    chdir: true
  run:
    dir: outputs/${hydra.job.name}/${now:%Y-%m-%d}/${now:%H-%M-%S}

# One file per recorded take, each a multichannel file whose last channel is the gesture
# activity target and whose other channels are the features, as captured in Max. Paths are
# relative to where you run the command, not to data_dir.
takes: []
label_channel: -1

# Frame rate of the captured features. jem.onsetsignals runs at hop 64 / 48 kHz = 750 Hz;
# fluid.melbands~ at hop 256 / 48 kHz = 187.5 Hz.
frame_rate: 750
segment_duration: 1.0

num_data: 1000
batch_size: 16
num_workers: 0
max_epochs: 250
learning_rate: 0.001
accelerator: cpu
seed: 0

val_fraction: 0.2
patience: 20
min_delta: 0.0

# Gain augmentation in the feature domain, since there is no audio to rescale. Each entry
# is the dB shift applied to that channel per 1 dB of gain. For jem.onsetsignals the two
# envelopes move with gain and their difference does not; for log mel bands every channel
# shifts by the full amount ([1.0] * 32).
#
# Do not set random_gain to 0 without good reason. Without augmentation the model scores
# well at the level it was trained at and then collapses elsewhere -- F1 0.897 at 0 dB but
# 0.655 at +12 dB and 0.183 at +18 dB, versus a flat ~0.86 across the whole range with
# augmentation on. See scripts/evaluate_gain_robustness.py.
random_gain: 12.0
gain_offsets: [1.0, 1.0, 0.0]
